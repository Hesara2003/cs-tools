openapi: 3.0.1
info:
  title: SSE Choreo Compatibility POC
  description: >
    Throwaway component that checks whether Choreo's API gateway delivers
    Server-Sent Events incrementally or buffers the response. See
    README.md for how to actually test it once deployed.
  version: 1.0.0
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check.
      operationId: getHealth
      responses:
        "200":
          description: Ok
  /stream:
    get:
      summary: SSE probe — a tick event every 2s, a ping heartbeat every 15s.
      operationId: getStream
      responses:
        "200":
          description: Ok
          content:
            text/event-stream:
              schema:
                type: string
