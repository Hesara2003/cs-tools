openapi: 3.0.1
info:
  title: Customer Portal Activity Stream Service Health
  description: Health check endpoint for customer-portal-activity-stream-service.
  version: 1.0.0
servers:
  - url: "{server}:{port}/"
    variables:
      server:
        default: http://localhost
      port:
        default: "8080"
paths:
  /health:
    get:
      summary: Health check.
      description: Returns 200 OK if the service is running. No auth required.
      operationId: getHealth
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]